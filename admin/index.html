<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - KK Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body style="align-items: center; justify-content: center; background: #0B0F19;">

  <div class="glass-card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 class="brand" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.3rem;">KK <span>Shop Admin</span></h1>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Sign in to access control panel</p>
    </div>

    <div id="auth-error" style="display: none; background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="admin-username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login To Dashboard</button>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
