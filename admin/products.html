<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - KK Shop Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">KK <span>Shop Admin</span></div>
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="products.html" class="nav-link active">Products</a></li>
      <li><a href="orders.html" class="nav-link">Orders</a></li>
      <li><a href="users.html" class="nav-link">Users</a></li>
      <li><a href="settings.html" class="nav-link">Settings</a></li>
    </ul>
  </aside>

  <div class="admin-wrapper">
    <header class="top-bar">
      <h2 style="font-size: 1.25rem; font-weight: 700;">Product Management</h2>
      <a href="add-product.html" class="btn btn-primary">+ Add Product</a>
    </header>

    <main class="content-area">
      <div class="glass-card">
        <div style="margin-bottom: 1.5rem;">
          <input type="text" id="product-search" class="form-control" placeholder="Search products by title or category..." style="max-width: 400px; background: #0F172A;">
        </div>

        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Loading products...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/products.js"></script>
</body>
</html>
