<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - KK Shop Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">KK <span>Shop Admin</span></div>
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="products.html" class="nav-link">Products</a></li>
      <li><a href="orders.html" class="nav-link">Orders</a></li>
      <li><a href="users.html" class="nav-link active">Users</a></li>
      <li><a href="settings.html" class="nav-link">Settings</a></li>
    </ul>
  </aside>

  <div class="admin-wrapper">
    <header class="top-bar">
      <h2 style="font-size: 1.25rem; font-weight: 700;">Registered Store Users</h2>
    </header>

    <main class="content-area">
      <div class="glass-card">
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Fetching users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { fetchAllUsers } from "./firebase/firestore.js";

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('users-table-body');
      if (!container) return;

      const users = await fetchAllUsers();
      if (users.length === 0) {
        container.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 2rem;">No registered users found.</td></tr>`;
        return;
      }

      container.innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td style="font-weight: 600;">${u.name || u.displayName || 'Customer'}</td>
          <td>${u.email || 'N/A'}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
