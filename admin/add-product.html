<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - KK Shop Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">KK <span>Shop Admin</span></div>
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="products.html" class="nav-link active">Products</a></li>
      <li><a href="orders.html" class="nav-link">Orders</a></li>
      <li><a href="users.html" class="nav-link">Users</a></li>
      <li><a href="settings.html" class="nav-link">Settings</a></li>
    </ul>
  </aside>

  <div class="admin-wrapper">
    <header class="top-bar">
      <h2 style="font-size: 1.25rem; font-weight: 700;">Add New Product</h2>
    </header>

    <main class="content-area">
      <form id="add-product-form" class="glass-card" style="max-width: 800px; margin: 0 auto;">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" id="prod-name" class="form-control" required placeholder="e.g. Wireless Noise Canceling Headphones">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <input type="text" id="prod-category" class="form-control" placeholder="Electronics, Fashion, etc." required>
          </div>
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" id="prod-brand" class="form-control" placeholder="Brand name">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Price ($) *</label>
            <input type="number" step="0.01" id="prod-price" class="form-control" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label class="form-label">Original Price ($)</label>
            <input type="number" step="0.01" id="prod-orig-price" class="form-control" placeholder="0.00">
          </div>
          <div class="form-group">
            <label class="form-label">Stock Quantity *</label>
            <input type="number" id="prod-stock" class="form-control" required placeholder="10">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="prod-desc" class="form-control" rows="4" placeholder="Detailed product specifications..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Product Image *</label>
          <input type="file" id="prod-file-input" accept="image/*" class="form-control" required>
        </div>

        <button type="submit" id="save-prod-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Publish Product To Store</button>
      </form>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { uploadProductImage } from "./firebase/storage.js";
    import { addProductToDB } from "./firebase/firestore.js";

    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-prod-btn');
      btn.disabled = true;
      btn.textContent = "Uploading image and saving...";

      try {
        const fileInput = document.getElementById('prod-file-input');
        let imageUrl = "";

        if (fileInput.files.length > 0) {
          imageUrl = await uploadProductImage(fileInput.files[0]);
        }

        const payload = {
          name: document.getElementById('prod-name').value.trim(),
          category: document.getElementById('prod-category').value.trim(),
          brand: document.getElementById('prod-brand').value.trim(),
          price: parseFloat(document.getElementById('prod-price').value),
          originalPrice: parseFloat(document.getElementById('prod-orig-price').value) || null,
          stock: parseInt(document.getElementById('prod-stock').value),
          description: document.getElementById('prod-desc').value.trim(),
          imageUrl: imageUrl,
          status: "Active"
        };

        await addProductToDB(payload);
        window.showToast("Product published successfully!");
        setTimeout(() => window.location.href = "products.html", 1000);
      } catch (err) {
        console.error(err);
        window.showToast("Error saving product", "error");
        btn.disabled = false;
        btn.textContent = "Publish Product To Store";
      }
    });
  </script>
</body>
</html>
