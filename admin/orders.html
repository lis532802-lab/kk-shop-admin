<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - KK Shop Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">KK <span>Shop Admin</span></div>
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="products.html" class="nav-link">Products</a></li>
      <li><a href="orders.html" class="nav-link active">Orders</a></li>
      <li><a href="users.html" class="nav-link">Users</a></li>
      <li><a href="settings.html" class="nav-link">Settings</a></li>
    </ul>
  </aside>

  <div class="admin-wrapper">
    <header class="top-bar">
      <h2 style="font-size: 1.25rem; font-weight: 700;">Order Management</h2>
    </header>

    <main class="content-area">
      <div class="glass-card">
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Order Details</th>
                <th>Customer & Address</th>
                <th>Items Ordered</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-orders-body">
              <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Listening for incoming orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/orders.js"></script>
</body>
</html>
